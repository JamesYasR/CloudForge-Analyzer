name: build-windows-installer

# 触发方式：
#   - 推送 v* 标签（如 v1.0.0）自动出安装包
#   - 在 GitHub 页面手动点击 Run workflow
# 日常 push 不触发，避免每次提交都全量编译 PCL/VTK/Qt。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write # x-gha 二进制缓存需要 cache/actions 权限

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  # 注意：不要用 x-gha 二进制缓存，它需要 run-vcpkg 注入的
  # ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL 环境变量；裸 vcpkg 命令下没有，
  # 会报错 "GHA binary source requires the ACTIONS_RUNTIME_TOKEN..."。
  # 这里留空走默认（纯本地构建，无缓存复用）。
  # 限制 vcpkg 并行编译数，避免 Windows runner 内存不足
  VCPKG_MAX_CONCURRENCY: "16"
  # 与 CMake 的 -DVCPKG_INSTALLED_DIR 保持一致
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
  STAGE_DIR: ${{ github.workspace }}/stage
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build-windows-installer:
    runs-on: windows-latest
    # GitHub Actions 普通 job 上限为 360 分钟；首次全量编译依赖较慢，
    # 之后依靠 x-gha 二进制缓存加速。
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # 1. 拉取本仓库代码
      # ---------------------------------------------------------------
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # 2. 拉取 vcpkg 并安装依赖。改成标准 vcpkg 命令，让真实报错直接显示在日志里
      #    （原 lukka/run-vcpkg 封装会吞掉 vcpkg install 的具体错误，难以诊断）。
      #    vcpkgGitCommitId 必须与 vcpkg.json 的 builtin-baseline 一致。
      # ---------------------------------------------------------------
      - name: Setup vcpkg (clone + bootstrap)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          cd "$env:VCPKG_ROOT"
          git checkout b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c
          # 修复: vcpkg baseline(2024-11) 锁定的 msys2 包已从滚动仓库消失(全镜像404)。
          # 逐个替换为现存版本 (URL+SHA512 均已实测):
          #   msys2-runtime 3.5.4-2 -> 3.6.4-1
          #   libtool       2.4.7-4 -> 2.5.4-1
          #   file          5.45-3  -> 5.48-1
          #   autoconf2.72  2.72-1  -> 2.72-3
          $msys = "$env:VCPKG_ROOT\scripts\cmake\vcpkg_acquire_msys.cmake"
          (Get-Content $msys -Raw) `
            -replace [regex]::Escape('https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst'), 'https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.6.4-1-x86_64.pkg.tar.zst' `
            -replace [regex]::Escape('070aeb43385beb0e3f8d5fb28909469765116c222d53c2614f5f080be879eef0b78258334b35e8cda7625d8704efc89133f8b8fa78f309c5d680ae270efdaba8'), '65de2d7c7fa3fb2996e6c29e1d400a3da51b02a1aaa7ad192214c7e5d4ae27fa835b84577eff707d6944931b26df764f76379d20751f1a510f9b77777422a8b2' `
            -replace [regex]::Escape('https://mirror.msys2.org/msys/x86_64/libtool-2.4.7-4-x86_64.pkg.tar.zst'), 'https://mirror.msys2.org/msys/x86_64/libtool-2.5.4-1-x86_64.pkg.tar.zst' `
            -replace [regex]::Escape('fa2f0d4ac3a5aca38988d6f901407c14185238e6554894fd0b1ebe35ee836388c3649c5547cf529778e2a62ce5a3dafae15568b33c0e5d5535b67bb9c46ac37a'), '65bdd278c19a6f32094d9944ac87418f38966e453f5fca60b2e00966731af88b119b94ef3cb6a68a9fd9a183f846d08a6524b9f273d311987acc308e84e3cf00' `
            -replace [regex]::Escape('https://mirror.msys2.org/msys/x86_64/file-5.45-3-x86_64.pkg.tar.zst'), 'https://mirror.msys2.org/msys/x86_64/file-5.48-1-x86_64.pkg.tar.zst' `
            -replace [regex]::Escape('https://mirror.msys2.org/msys/x86_64/autoconf2.72-2.72-1-any.pkg.tar.zst'), 'https://mirror.msys2.org/msys/x86_64/autoconf2.72-2.72-3-any.pkg.tar.zst' `
            -replace [regex]::Escape('c8dc3e317dc4befc5f2848ac339a74f9dc8f021767aadb3d2c50b13869e0ef49fb48c62a0a1df5176a15a4f10196fcd2307efb83ff143ba1d20301882ba8dd1e'), '307751b00b6a9729673d0af35ccf327041880f20498143100053a9d914927e86dd20a4aa4cd9e83e3d4e7e27c2d068cfc0313c6cab4f103955e4dafede22f4d0' `
            -replace [regex]::Escape('14f6bb0a19f8c74d5b3fe4e95fcf013c0db3bb270c795009f315a2207ca099efc32a9ab487dee72603c0adbe2949337724bbb28b779c71bbf9c1045ad6e23e72'), 'a44e90c23b768c10cf7efa4f4610a630508b1eba2f21e1f1e35082e751e5a710974cee278c3930a739411c8f3c50e8b8416be1f19531c0e4166ade63426fbb7d' |
            Set-Content $msys -NoNewline
          Write-Host "=== msys2 包替换后确认 ==="
          Select-String -Path $msys -Pattern "msys2-runtime-3|libtool-|file-|autoconf2.72-" | ForEach-Object { Write-Host $_.Line.Trim() }
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Install dependencies (vcpkg install)
        shell: pwsh
        run: |
          cd "$env:GITHUB_WORKSPACE"
          # 强制清空 binary sources，避免 runner 环境带入 x-gha 缓存配置
          # （x-gha 需要 ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL，裸 vcpkg 下没有会报错）
          $env:VCPKG_BINARY_SOURCES = "clear"
          # 详细日志：输出到 vcpkg-install.log，失败时打印关键错误段
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet "$env:VCPKG_DEFAULT_TRIPLET" `
            --x-install-root "$env:VCPKG_INSTALLED_DIR" 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\vcpkg-install.log"
          $code = $LASTEXITCODE
          Write-Host "=== vcpkg install exit code: $code ==="
          if ($code -ne 0) {
            Write-Host "===== 最近的错误日志 (倒数 60 行) ====="
            Get-Content "$env:GITHUB_WORKSPACE\vcpkg-install.log" -Tail 60 | ForEach-Object { Write-Host $_ }
            Write-Host "===== 找 error/FAILED 关键行 ====="
            Select-String -Path "$env:GITHUB_WORKSPACE\vcpkg-install.log" -Pattern "error:|FAILED:|Download failed|BUILD_FAILED|CMake Error" | Select-Object -Last 20 | ForEach-Object { Write-Host $_.Line }
            Write-Host "===== vcpkg buildtrees 详细日志 (最近修改的 out/err log 各尾 150 行) ====="
            Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Include *-out.log,*-err.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 8 |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName -Tail 150 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              }
            exit $code
          }

      - name: Upload vcpkg install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-install-log
          path: ${{ github.workspace }}/vcpkg-install.log
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # 3. 校验安装出的 VTK 是官方 9.3.0，而不是 ParaView 补丁版 pv5.12.1
      # ---------------------------------------------------------------
      - name: Verify exact VTK version from vcpkg
        shell: pwsh
        run: |
          $vtkLine = & "$env:VCPKG_ROOT\vcpkg.exe" list | Select-String -Pattern '^vtk:'
          $line = $vtkLine.Line
          Write-Host "vcpkg vtk line: $line"
          if (-not $line) {
            throw "vtk was not found in vcpkg list output"
          }
          if ($line -notmatch '9\.3\.0' -or $line -match 'pv5') {
            throw "Expected exact VTK 9.3.0 from overlay port, got: $line"
          }

      # ---------------------------------------------------------------
      # 4. 使用 MSVC(v143) 配置 Release/x64
      # ---------------------------------------------------------------
      - name: Configure CMake (MSVC x64 Release)
        shell: pwsh
        run: |
          # runner 已升级到 VS 18 (Enterprise)，不再硬编码 VS17 2022，避免 generator 找不到实例。
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE/vcpkg-ports" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/vcpkg-triplets" `
            -DCMAKE_INSTALL_PREFIX="$env:STAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------
      # 5. MSVC Release 编译
      # ---------------------------------------------------------------
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------
      # 6. 安装到 stage 目录。
      #    CMake install 会执行：
      #      a) 安装 exe + PCDfiles
      #      b) 复制 vcpkg x64-windows/bin 下全部 release DLL
      #      c) 运行 qt_generate_deploy_app_script 生成的脚本
      #         （内部调用 windeployqt，补齐 Qt 插件与 MSVC 运行库）
      # ---------------------------------------------------------------
      - name: Deploy runtime into stage directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:STAGE_DIR" | Out-Null
          cmake --install build --config Release --prefix "$env:STAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # VS18/CMake4.4 下 qt_generate_deploy_app_script 可能未生成 deploy 脚本，
          # 这里手动运行 windeployqt 兜底/补充 Qt 插件与运行库。
          $windeployqt = Get-ChildItem "$env:VCPKG_INSTALLED_DIR\tools" -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windeployqt) {
            throw "windeployqt.exe not found under $env:VCPKG_INSTALLED_DIR\tools"
          }
          Write-Host "Using windeployqt: $($windeployqt.FullName)"
          & $windeployqt.FullName --release --no-translations "$env:STAGE_DIR\CloudForgeAnalyzer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== stage directory ==="
          Get-ChildItem -Recurse "$env:STAGE_DIR" | Select-Object FullName | Format-Table -AutoSize

      # ---------------------------------------------------------------
      # 7. 计算安装包版本号
      # ---------------------------------------------------------------
      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v?(\d+\.\d+\.\d+)') {
            $v = $Matches[1]
          } else {
            $v = "1.0.0"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "APP_VERSION=$v"

      # ---------------------------------------------------------------
      # 8. 准备 NSIS 并打包
      #    NSIS 脚本本身还会执行一次 VCPKG_BIN_DIR -> stage 的 DLL 全量
      #    收集（幂等），确保即使 CMake 部署步骤被裁剪也能独立运行。
      # ---------------------------------------------------------------
      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ARTIFACT_DIR" | Out-Null

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            Write-Host "NSIS not found, installing via Chocolatey..."
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $vcpkgBin = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows\bin"
          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg bin directory not found: $vcpkgBin"
          }

          & $makensis /V2 `
            "/DAPP_VERSION=$env:APP_VERSION" `
            "/DAPP_BUILD_DIR=$env:STAGE_DIR" `
            "/DVCPKG_BIN_DIR=$vcpkgBin" `
            "/DOUTPUT_DIR=$env:ARTIFACT_DIR" `
            "$env:GITHUB_WORKSPACE\cmake\nsis\CloudForgeAnalyzer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem "$env:ARTIFACT_DIR" | Select-Object Name, Length

      # ---------------------------------------------------------------
      # 9. 上传安装包
      # ---------------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudForgeAnalyzer-Windows-x64-Installer-${{ steps.version.outputs.version }}
          path: ${{ github.workspace }}/artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
