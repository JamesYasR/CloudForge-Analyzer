name: build-windows-installer

# 触发方式：
#   - 推送 v* 标签（如 v1.0.0）自动出安装包
#   - 在 GitHub 页面手动点击 Run workflow
# 日常 push 不触发，避免每次提交都全量编译 PCL/VTK/Qt。
on:
  workflow_dispatch:
    inputs:
      cache_only:
        description: 'Verify dependency cache: fail instead of building missing packages'
        type: boolean
        default: false
      restore_from_release:
        description: 'Skip Actions cache and require the durable Release dependency backup'
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write # 保存依赖二进制缓存

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
  # PowerShell/CMake/Ninja 的版本参与 ABI；使用 baseline 固定工具，避免镜像更新使缓存失效。
  VCPKG_FORCE_DOWNLOADED_BINARIES: '1'
  # 用本地文件二进制缓存配合 actions/cache；不依赖已失效的 x-gha provider。
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
  # 限制 vcpkg 并行编译数，避免 Windows runner 内存不足
  VCPKG_MAX_CONCURRENCY: "16"
  # 与 CMake 的 -DVCPKG_INSTALLED_DIR 保持一致
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
  STAGE_DIR: ${{ github.workspace }}/stage
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build-windows-installer:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write # 维护长期依赖备份 Release
      actions: write
    # GitHub Actions 普通 job 上限为 360 分钟；首次全量编译依赖较慢，
    # 之后依靠文件二进制缓存加速。
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # 1. 拉取本仓库代码
      # ---------------------------------------------------------------
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------
      # 2. 拉取 vcpkg 并安装依赖。改成标准 vcpkg 命令，让真实报错直接显示在日志里
      #    （原 lukka/run-vcpkg 封装会吞掉 vcpkg install 的具体错误，难以诊断）。
      #    vcpkgGitCommitId 必须与 vcpkg.json 的 builtin-baseline 一致。
      # ---------------------------------------------------------------
      - name: Setup vcpkg (clone + bootstrap)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          cd "$env:VCPKG_ROOT"
          git checkout b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c
          & "$env:GITHUB_WORKSPACE/.github/scripts/patch-msys.ps1" -VcpkgRoot $env:VCPKG_ROOT
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Select pinned dependency toolchain
        id: toolchain
        shell: pwsh
        run: ./.github/scripts/ci-toolchain.ps1

      - name: Compute dependency cache key
        id: dependency-cache
        shell: pwsh
        env:
          CACHE_KEY: vcpkg-v2-windows2025-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**', 'vcpkg-triplets/**', '.github/scripts/patch-msys.ps1', '.github/scripts/msys-packages.json') }}
        run: '"key=$env:CACHE_KEY" >> $env:GITHUB_OUTPUT'

      - name: Restore vcpkg binary cache
        if: ${{ !inputs.restore_from_release }}
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.dependency-cache.outputs.key }}
          restore-keys: |
            vcpkg-v2-windows2025-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Restore durable dependency backup
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        id: release-cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.dependency-cache.outputs.key }}
          REQUIRE_RELEASE: ${{ inputs.restore_from_release || false }}
        run: ./.github/scripts/ci-release-cache.ps1 -Mode Restore -CacheKey $env:CACHE_KEY -Required:($env:REQUIRE_RELEASE -eq 'true')

      - name: Install dependencies (vcpkg install)
        id: dependencies
        shell: pwsh
        env:
          CACHE_ONLY: ${{ inputs.cache_only || false }}
        run: ./.github/scripts/install-ci-dependencies.ps1 -CacheOnly:($env:CACHE_ONLY -eq 'true')

      # Only publish a complete dependency cache, and avoid duplicate snapshots
      # when the exact key was already restored.
      - name: Save vcpkg binary cache
        if: steps.dependencies.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true' && !inputs.restore_from_release
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.dependency-cache.outputs.key }}

      - name: Back up dependencies to GitHub Release
        if: steps.dependencies.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.dependency-cache.outputs.key }}
        run: ./.github/scripts/ci-release-cache.ps1 -Mode Backup -CacheKey $env:CACHE_KEY

      - name: Upload dependency cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-cache-diagnostics
          path: |
            ${{ github.workspace }}/ci-diagnostics/
            ${{ github.workspace }}/vcpkg-install.log
            ${{ github.workspace }}/vcpkg/buildtrees/**/vcpkg_abi_info.txt
            ${{ github.workspace }}/vcpkg/buildtrees/**/*vcpkg_abi_info.txt
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------
      # 3. 校验安装出的 VTK 是官方 9.3.0，而不是 ParaView 补丁版 pv5.12.1
      # ---------------------------------------------------------------
      - name: Verify exact VTK version from vcpkg
        shell: pwsh
        run: |
          $vtkLine = & "$env:VCPKG_ROOT\vcpkg.exe" list | Select-String -Pattern '^vtk:'
          $line = $vtkLine.Line
          Write-Host "vcpkg vtk line: $line"
          if (-not $line) {
            throw "vtk was not found in vcpkg list output"
          }
          if ($line -notmatch '9\.3\.0' -or $line -match 'pv5') {
            throw "Expected exact VTK 9.3.0 from overlay port, got: $line"
          }

      # ---------------------------------------------------------------
      # 4. 使用 MSVC(v143) 配置 Release/x64
      # ---------------------------------------------------------------
      - name: Configure CMake (MSVC x64 Release)
        shell: pwsh
        run: |
          # 与依赖使用同一 v143 工具集和 Windows SDK。
          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -T "v143,version=14.44.35207" `
            -DCMAKE_SYSTEM_VERSION=10.0.26100.0 `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE/vcpkg-ports" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/vcpkg-triplets" `
            -DCMAKE_INSTALL_PREFIX="$env:STAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------
      # 5. MSVC Release 编译
      # ---------------------------------------------------------------
      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ---------------------------------------------------------------
      # 6. 安装到 stage 目录。
      #    CMake install 会执行：
      #      a) 安装 exe + PCDfiles
      #      b) 复制 vcpkg x64-windows/bin 下全部 release DLL
      #      c) 运行 qt_generate_deploy_app_script 生成的脚本
      #         （内部调用 windeployqt，补齐 Qt 插件与 MSVC 运行库）
      # ---------------------------------------------------------------
      - name: Deploy runtime into stage directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:STAGE_DIR" | Out-Null
          cmake --install build --config Release --prefix "$env:STAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # VS18/CMake4.4 下 qt_generate_deploy_app_script 可能未生成 deploy 脚本，
          # 这里手动运行 windeployqt 兜底/补充 Qt 插件与运行库。
          # vcpkg 安装树实际为 $env:VCPKG_INSTALLED_DIR\x64-windows\tools\Qt6\bin\windeployqt.exe，
          # 因此从 VCPKG_INSTALLED_DIR 整树递归查找。
          $windeployqt = Get-ChildItem "$env:VCPKG_INSTALLED_DIR" -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windeployqt) {
            throw "windeployqt.exe not found under $env:VCPKG_INSTALLED_DIR"
          }
          Write-Host "Using windeployqt: $($windeployqt.FullName)"
          & $windeployqt.FullName --release --no-translations "$env:STAGE_DIR\CloudForgeAnalyzer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "=== stage directory ==="
          Get-ChildItem -Recurse "$env:STAGE_DIR" | Select-Object FullName | Format-Table -AutoSize

      # ---------------------------------------------------------------
      # 7. 计算安装包版本号
      # ---------------------------------------------------------------
      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v?(\d+\.\d+\.\d+)') {
            $v = $Matches[1]
          } else {
            $v = "1.0.0"
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "APP_VERSION=$v"

      # ---------------------------------------------------------------
      # 8. 准备 NSIS 并打包
      #    NSIS 脚本本身还会执行一次 VCPKG_BIN_DIR -> stage 的 DLL 全量
      #    收集（幂等），确保即使 CMake 部署步骤被裁剪也能独立运行。
      # ---------------------------------------------------------------
      - name: Build NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ARTIFACT_DIR" | Out-Null

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            Write-Host "NSIS not found, installing via Chocolatey..."
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $vcpkgBin = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows\bin"
          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg bin directory not found: $vcpkgBin"
          }

          & $makensis /V2 `
            "/DAPP_VERSION=$env:APP_VERSION" `
            "/DAPP_BUILD_DIR=$env:STAGE_DIR" `
            "/DVCPKG_BIN_DIR=$vcpkgBin" `
            "/DOUTPUT_DIR=$env:ARTIFACT_DIR" `
            "$env:GITHUB_WORKSPACE\cmake\nsis\CloudForgeAnalyzer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem "$env:ARTIFACT_DIR" | Select-Object Name, Length

      # ---------------------------------------------------------------
      # 9. 上传安装包
      # ---------------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudForgeAnalyzer-Windows-x64-Installer-${{ steps.version.outputs.version }}
          path: ${{ github.workspace }}/artifacts/*.exe
          if-no-files-found: error
          retention-days: 30
